# Render Blueprint — one-click production deployment for the real estate platform.
#
# How to use (one action, in a browser):
#   https://dashboard.render.com/blueprints
#   → "New Blueprint Instance" → connect https://github.com/IslamBasuony/Reale-state-react
#   → branch main → "Apply".
#
# This creates:
#   - reale-state-db  (managed PostgreSQL, free plan)
#   - reale-state     (Node web service: builds the React SPA, serves API + SPA
#                      on a single HTTPS origin, provisions demo data after deploy)
#
# All secrets are either generated by Render (SESSION_SECRET_KEY) or come from the
# linked database resource. Nothing secret is stored in this file or in git.
#
# NOTE: set the free web-service plan; uploads go to an ephemeral disk by design
# (seeded demo images are external Cloudinary URLs and are unaffected).

services:
  - type: web
    name: reale-state
    runtime: node
    plan: free
    branch: main
    rootDir: .
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node server.js
    postDeploy: cd backend && npm run seed:demo
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Must be the exact public HTTPS origin of this service.
      # If the name "reale-state" is unavailable, Render will suggest another
      # hostname — update this URL to match before applying.
      - key: CLIENT_URL
        value: https://reale-state.onrender.com
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: reale-state-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: reale-state-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: reale-state-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: reale-state-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: reale-state-db
          property: password

databases:
  - name: reale-state-db
    plan: free