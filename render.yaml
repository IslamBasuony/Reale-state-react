# Render Blueprint — one-click deployment for the AqarWeb (real estate) platform.
#
# How to use (in a browser):
#   https://dashboard.render.com/blueprints
#   → "New Blueprint Instance" → connect https://github.com/IslamBasuony/Reale-state-react
#   → branch main → "Apply".
#
# This creates ONE resource:
#   - reale-state  (Node web service: builds the React SPA, serves API + SPA
#                    on a single HTTPS origin, provisions demo data after deploy)
#
# The PostgreSQL database is EXTERNAL — Supabase free tier — and is NOT created
# by this Blueprint. The DB_* variables below are declared with `sync: false`:
# after applying, fill their values in the service's "Environment" tab using
# your Supabase project (Project Settings → Database → Connection string):
#   DB_HOST=db.<project>.supabase.co
#   DB_PORT=5432
#   DB_NAME=postgres
#   DB_USER=postgres
#   DB_PASSWORD=<your supabase database password>
# The backend's production DB config enables SSL automatically
# (rejectUnauthorized: false), which matches Supabase's SSL requirement.
#
# Secrets policy: NOTHING secret lives in this file or in git.
#   - SESSION_SECRET_KEY is generated at deploy time by Render (generateValue).
#   - DB_* (including DB_PASSWORD) are entered by you in the dashboard, never git.
#
# NOTE: set the free web-service plan; uploads go to an ephemeral disk by design
# (seeded demo images are external Cloudinary URLs and are unaffected).

services:
  - type: web
    name: reale-state
    runtime: node
    plan: free
    branch: main
    rootDir: .
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node server.js
    postDeploy: cd backend && npm run seed:demo
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Must be the exact public HTTPS origin of this service.
      # If the name "reale-state" is unavailable, Render will suggest another
      # hostname — update this URL (and CLIENT_URL) to match before applying.
      - key: CLIENT_URL
        value: https://reale-state.onrender.com
      # Session signing secret — generated by Render, never stored in git.
      - key: SESSION_SECRET_KEY
        generateValue: true
      # External Supabase PostgreSQL credentials — sync:false declares the keys
      # so the dashboard shows them for you, but never writes/overwrites values.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false